[project]
name = "stratum"
version = "2.0.0"
description = "Stratum - local-first AI execution runtime for repository transformation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "kafka-python-ng>=2.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
stratum = "stratum.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stratum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "acceptance_provider: requires a real configured AI provider (env-gated)",
    "acceptance_broker: requires a real local Redpanda/Kafka broker (env-gated)",
]
